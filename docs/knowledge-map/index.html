<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>MyAtlas V6.6</title><link rel="stylesheet" href="shell.css"></head>
<body>
<header id="application-header"><h1>Knowledge Atlas</h1><nav id="application-nav" aria-label="Main views"><a id="nav-atlas" href="?view=atlas" data-view="atlas">Atlas</a><a id="nav-skill-tree" href="?view=skill-tree" data-view="skill-tree">My Skill Tree</a></nav></header>
<main id="view-content" aria-label="Atlas view">
<section id="atlas-filters" aria-label="Optional Atlas scope filters">
<div id="filter-controls">
<label class="filter-field" id="course-filter"><span>Course</span><input id="course-search" type="search" placeholder="Name / ID" aria-label="Search Courses by title or exact ID" autocomplete="off"><select id="course-choice" aria-label="Optional Course filter" disabled><option>Loading catalog…</option></select></label>
<label class="filter-field" id="project-filter"><span>Project</span><input id="project-search" type="search" placeholder="Name / ID" aria-label="Search Projects by title or exact ID" autocomplete="off"><select id="project-choice" aria-label="Optional Project filter" disabled><option>Loading catalog…</option></select></label>
<label class="filter-field" id="stage-filter" hidden><span>Stage</span><input id="stage-search" type="search" placeholder="Name / ID" aria-label="Search declared Stages by title or exact ID" autocomplete="off"><select id="stage-choice" aria-label="Optional Stage filter" disabled></select></label>
<button id="reset-filters">Reset filters</button>
<div id="knowledge-search" role="search"><input id="knowledge-query" type="search" placeholder="Find knowledge…" aria-label="Search displayed knowledge" autocomplete="off" aria-controls="knowledge-results"><div id="knowledge-results"></div><button id="view-theme" aria-label="Toggle light or dark theme">◐</button></div>
</div>
<div id="filter-context"><p id="atlas-context" role="status">Atlas · Global Atlas</p><p id="association-status"></p></div>
</section>
<div id="map-content"><p id="loading" role="status" hidden>Opening Atlas…</p></div>
</main>
<script>const q=new URLSearchParams(location.search);let changed=false;for(const k of ['course','project','stage'])if(q.has(k+'_id')&&!q.has(k)){q.set(k,q.get(k+'_id'));q.delete(k+'_id');changed=true;}if(['my','my-atlas','my-knowledge'].includes(q.get('view'))){q.set('view','skill-tree');changed=true;}if(!q.has('key')&&/^(topic|category):[1-9][0-9]*$/.test(location.hash.slice(1))){q.set('key',location.hash.slice(1));changed=true;}if(changed)history.replaceState(null,'','?'+q);</script><script src="shell.js"></script>
</body></html>
