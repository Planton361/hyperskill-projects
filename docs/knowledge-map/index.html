<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge Atlas</title><link rel="stylesheet" href="style.css"><body>
<header><div><strong>Knowledge Atlas</strong><span id="preview-note">Production candidate · read-only review</span></div><nav><button id="compact">Compact view</button><button id="highlight">Highlight in Atlas</button><button id="mask" hidden>Strict global mask</button><button id="global">Global reference</button></nav></header>
<aside><label for="scene">Scope</label><select id="scene"><option value="learned">My Knowledge</option><option value="accepted">Accepted Landscape</option><option value="course">Course</option><option value="project">Project</option></select>
<label for="context">Course / Project</label><select id="context"></select><label for="stage">Stage requirements</label><select id="stage"></select><label class="check"><input type="checkbox" id="only-learned"> Learned only</label><p id="pending" aria-live="polite"></p><p id="summary"></p><p class="legend">Ancestors are context.<br>● learned · ◉ verified<br>Completion is no learning evidence.</p>
<label for="branch">Branch filter · confirm with view action</label><select id="branch"><option value="">Entire scope</option></select><div class="row"><button id="fit">Fit</button><button id="back">Back</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button></div><div class="row"><button id="collapse">Summarize branch</button><button id="expand">Open details</button></div><button id="summarize">Summarize large scope</button>
<label class="check"><input type="checkbox" id="animate" checked> Animate learning updates</label><label class="check"><input type="checkbox" id="progress" checked> Learning marks</label><button id="snapshot-refresh">Reload accepted snapshot</button>
<label for="search">Search complete known registry</label><input id="search" type="search" placeholder="Title, topic:36, reference:333"><div id="results"></div><div id="details">Select a card or search result.</div><button id="global-show" disabled>Show in Global Atlas</button><button id="my-show" disabled>Show in My Knowledge</button><div id="related"></div><p id="metrics"></p></aside>
<main><div id="view-title"></div><div id="context-roots" aria-label="Global branch context by identity"></div><div id="breadcrumbs"></div><div id="surface"><canvas id="map" tabindex="0" aria-label="Knowledge Atlas: arrows pan, plus/minus zoom; search and branch controls open details"></canvas><canvas id="mini" width="190" height="110" tabindex="0" aria-label="Minimap in the current view coordinate system"></canvas><div id="tooltip" hidden></div><div id="empty" hidden></div></div><footer id="status" aria-live="polite">Loading…</footer></main>
<script src="atlas.js"></script><script src="labels.js"></script><script src="ux.js"></script><script src="vendor/d3-flextree-2.1.2.cjs"></script><script src="adaptive.cjs"></script><script src="registry.cjs"></script><script src="views.cjs"></script><script src="app.js"></script></body></html>
