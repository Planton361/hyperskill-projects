<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge Atlas · Preview</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="identity"><h1>Knowledge Atlas <small>· Preview</small></h1><p>A place for what you know.</p></div><div class="toolbar"><div class="modes" aria-label="View emphasis"><button id="my" aria-pressed="true">My Knowledge</button><button id="roadmap" aria-pressed="false">Course Roadmap</button></div><div class="search"><label class="sr" for="search">Search topics, categories and projects</label><input id="search" type="search" placeholder="Find knowledge…" autocomplete="off" aria-controls="results"><div id="results"></div></div><button id="theme" aria-label="Toggle light or dark theme">◐</button></div><p id="mode-summary"></p></header>
<main><section id="canvas" aria-label="Interactive knowledge taxonomy"><div class="map-controls"><button id="fit">Fit all</button><button id="fit-subtree">Fit selected subtree</button><button id="out" aria-label="Zoom out">−</button><output id="zoom-value" role="status" aria-label="Map zoom" aria-live="polite" aria-atomic="true">100%</output><button id="in" aria-label="Zoom in">+</button></div><p id="view-status" aria-live="polite"></p><nav id="overview-guide" aria-label="Knowledge landscape regions"></nav><svg id="graph" aria-label="Complete course taxonomy. Drag to pan; scroll or pinch to zoom."></svg><svg id="minimap" aria-hidden="true" focusable="false"></svg><div class="map-footer"><span id="counts"></span><span>● Learned · ◎ Verified · ○ Not learned · <em>◇ Evidence</em></span></div></section><aside aria-label="Inspector"><div class="inspector-top"><span>INSPECT / EVIDENCE</span><button id="clear" aria-label="Clear selection">×</button></div><div id="inspector" aria-live="polite"></div></aside></main><p id="error" role="alert"></p><div id="announcement" class="sr" role="status"></div>
<script src="vendor/d3-7.9.0.min.js"></script><script src="layout.js"></script><script src="model.js"></script><script src="routing.js"></script><script src="app.js"></script></body></html>
