<!doctype html><meta charset="utf-8"><title>V6.6 full-title Safari DPR2</title>
<style>body{margin:0;background:#101820;color:white;font:14px system-ui}iframe{border:0;width:1440px;height:900px;display:block}p{margin:8px}</style><p id="note">Running native Safari check…</p><iframe></iframe>
<script>
(async()=>{

for(const phase of ['after']){
 frame.src=phase==='before'?'/before/index.html':'/index.html';await new Promise(r=>frame.onload=r);const w=frame.contentWindow;while(!w.AtlasV6)await pause(20);const api=w.AtlasV6;
 const settle=async()=>{while(api.state().transitioning)await pause(10);await api.state().renderer.settled()};
 out.runs[phase]={};
 for(const [name,key]of [['overview',null],['subtree','category:1164'],['topic','topic:3887']]){
 const settle=async()=>{while(api.state().transitioning)await pause(10);await api.state().renderer.settled()};
 if(key)api.select(key,true);else api.fit(null,false);await settle();
 const original=api.state(),scene=original.renderer.scene,geometry=JSON.stringify(original.L.nodes.map(n=>[n.key,n.x,n.y,n.width,n.height]));let calls=0;const build=w.AtlasLayout.build;w.AtlasLayout.build=(...args)=>{calls++;return build(...args)};
 const graph=w.document.querySelector('#graph'),evt=(type,x,y)=>new w.MouseEvent(type,{bubbles:true,cancelable:true,view:w,clientX:x,clientY:y,buttons:type==='mouseup'?0:1,button:0}),frames=[],js=[];
 const run=(ms,fn)=>new Promise(resolve=>{let start,prev;function tick(t){start??=t;if(prev!==undefined)frames.push(t-prev);prev=t;const u=Math.min(1,(t-start)/ms),a=performance.now();fn(u);js.push(performance.now()-a);if(u<1)w.requestAnimationFrame(tick);else resolve()}w.requestAnimationFrame(tick)});
 const pan=async()=>{graph.dispatchEvent(evt('mousedown',500,460));await run(650,u=>w.dispatchEvent(evt('mousemove',500+100*Math.sin(u*Math.PI*2),460+50*Math.sin(u*Math.PI*2))));w.dispatchEvent(evt('mouseup',500,460))};
 const zoom=async()=>{let last=0;await run(850,u=>{const total=220*Math.sin(u*Math.PI*2);graph.dispatchEvent(new w.WheelEvent('wheel',{bubbles:true,cancelable:true,view:w,clientX:500,clientY:460,deltaY:total-last}));last=total});await pause(180)};
 await pan();await zoom();await settle();if(!key)api.fit(null,false);await settle();frames.length=js.length=0;const r=api.state().renderer,at=r.metrics.frameMs.length;
 await pan();await zoom();await settle();out.runs[phase][name]={frames:hist(frames),inputJS:hist(js),renderJS:hist(r.metrics.frameMs.slice(at)),layoutCalls:calls,geometryUnchanged:geometry===JSON.stringify(api.state().L.nodes.map(n=>[n.key,n.x,n.y,n.width,n.height])),sceneUnchanged:scene===r.scene,entities:r.scene.entities.length,bytes:r.bytes,cap:r.stats().cap,mode:r.metrics.mode,viewport:[w.innerWidth,w.innerHeight],stateAfterNavigation:api.state().viewState};
 w.AtlasLayout.build=build;
 }
 document.querySelector('#note').textContent=phase+' done';
}
await fetch('/safari-result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(out)});document.querySelector('#note').textContent='Complete — native Safari full-title warm navigation';window.probeResult=out;
})().catch(e=>document.querySelector('#note').textContent='Error: '+e.stack);
</script>
