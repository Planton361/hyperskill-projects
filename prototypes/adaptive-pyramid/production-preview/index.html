<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adaptive Production review</title>
<style>body{margin:0;background:#101a25;color:#e7f0f7;font:16px system-ui}header{padding:16px 24px}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{color:#e7f0f7;background:#20354b;border:1px solid #54728d;padding:8px 12px;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#365d7b}iframe{width:100%;height:900px;border:0}section{padding:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}figure{margin:0}img{width:100%}figcaption{padding:8px}a{display:inline-block;text-decoration:none}</style>
<header><h1>Production Adaptive-View Migration Preview</h1><p>Is the adaptive Production candidate clearly better for normal learning while preserving global orientation?</p><p>Read-only isolated packages. Current Production, State and Knowledge remain unchanged. No apply is authorized.</p>
<nav><button data-view="current">Current Production</button><button data-view="learned">Target My Knowledge</button><button data-view="global">Target Global</button><button data-view="course">Target Course</button><button data-view="project">Target Project</button><a href="target/" target="_blank">Open target at full viewport</a></nav><p id="caption"></p></header>
<iframe id="preview" title="Selected isolated review view"></iframe>
<section><figure><img src="current-production.png" alt="Current Production at 1440 by 900"><figcaption>Current Production</figcaption></figure><figure><img src="my-knowledge.png" alt="Adaptive My Knowledge"><figcaption>Target My Knowledge · 31 explicitly learned Topics</figcaption></figure><figure><img src="global.png" alt="Immutable Global Reference"><figcaption>Target Global · 3,955 reference positions</figcaption></figure><figure><img src="course.png" alt="Compact Course 8"><figcaption>Target Course · explicit membership, compact or global highlight</figcaption></figure><figure><img src="project.png" alt="Compact Project 113"><figcaption>Target Project · explicit requirements and Stage filter</figcaption></figure></section>
<script>const frame=document.querySelector('iframe'),caption=document.querySelector('#caption');let scope='learned';const descriptions={current:'Frozen byte-identical copy of current Production.',learned:'Learned Topics plus hierarchy context; accepted content is separate.',global:'Complete immutable global reference; local coordinates do not replace reference positions.',course:'Course 8 compact membership. Highlight in Atlas preserves the global camera and geometry.',project:'Project 113 compact requirements. Stage selection uses explicit Stage requirements.'};function choose(view){scope=view;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));caption.textContent=descriptions[view];frame.src=view==='current'?'current/':'target/';}frame.onload=()=>{if(scope==='current')return;const w=frame.contentWindow;function ready(){if(!w.KnowledgeAtlas){setTimeout(ready,30);return;}w.KnowledgeAtlas.confirm({mode:scope,id:scope==='project'?113:8,stage:null,onlyLearned:false,branch:null},scope==='global'?'reference':'compact');}ready();};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>choose(b.dataset.view));choose('learned');</script></html>
