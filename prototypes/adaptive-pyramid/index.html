<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kompakte persönliche Pyramide · Vergleich</title><link rel="stylesheet" href="style.css">
<body><header><div><strong>Persönliche Pyramide</strong><span> Isolierter Vergleich · aktueller lokaler Datenstand</span></div><nav><button id="compact">Kompakt anzeigen</button><button id="highlight">Im Atlas hervorheben</button><button id="mask">Feste globale Projektion</button></nav></header>
<aside><label for="scene">Auswahl</label><select id="scene"><option value="learned">Mein Wissen</option><option value="accepted">Akzeptierte Landschaft</option><option value="course">Course 8</option><option value="project">Projekt</option><optgroup label="ISOLIERTE FIXTURES · keine echten Fortschritte"><option value="fixture:growth-branch">Lernschritte · ein Ast</option><option value="fixture:growth-wide">Lernschritte · mehrere Äste</option><option value="fixture:load-300">300 simulierte Topic-Karten</option><option value="fixture:load-1000">1.000 simulierte Topic-Karten</option><option value="fixture:full">Vollständige Struktur</option></optgroup></select>
<label for="project">Projekt</label><select id="project"></select><label for="stage">Stage · explizite Anforderungen</label><select id="stage"></select><label class="check"><input type="checkbox" id="only-learned"> nur gelernt</label><p id="pending" aria-live="polite"></p>
<p id="summary"></p><p class="legend">Vorfahren sind Kontext.<br>● learned · ◉ verified<br>Projektabschluss ist kein Lernbeleg.</p>
<label for="branch">Ast fokussieren</label><select id="branch"><option value="">Gesamte Auswahl</option></select>
<div class="row"><button id="fit">Einpassen</button><button id="back">Zurück</button><button id="zoom-in" aria-label="Vergrößern">+</button><button id="zoom-out" aria-label="Verkleinern">−</button></div>
<div class="row"><button id="collapse">Ast zusammenfassen</button><button id="expand">Details öffnen</button></div><button id="summarize">Große Auswahl zusammenfassen</button>
<div id="fixture-controls" hidden><p class="fixture">FIXTURE · Struktur-Slots, keine erfundenen Titel oder persönlichen Fakten</p><button id="next-step">Nächster simulierter Lernschritt</button><span id="step"></span></div>
<label class="check"><input type="checkbox" id="animate"> kurze Übergangsanimation</label><label class="check"><input type="checkbox" id="progress" checked> Lernmarkierungen</label>
<label for="search">Suche · Titel / Entity-ID / leaf-ID</label><input type="search" id="search" placeholder="z. B. topic:78 oder reference:333"><div id="results"></div><div id="details">Eine Karte auswählen.</div><button id="global-show" disabled>In globaler Pyramide zeigen</button>
<p id="metrics"></p><a href="../global-pyramid/" target="_blank">Globale Referenz öffnen</a></aside>
<main><div id="view-title"></div><div id="context-roots" aria-label="Globaler Kontext nach Entities"></div><div id="breadcrumbs"></div><div id="surface"><canvas id="map" tabindex="0" aria-label="Kompakte Hierarchie; Pfeiltasten verschieben, Plus und Minus zoomen"></canvas><iframe id="atlas" title="Unveränderte globale Referenz" src="../global-pyramid/" hidden></iframe><canvas id="atlas-overlay" hidden></canvas><div id="tooltip" hidden></div><div id="empty" hidden></div></div><footer id="status" aria-live="polite">Laden…</footer></main>
<script src="../global-pyramid/atlas.js"></script><script src="../global-pyramid/ux.js"></script><script src="../global-pyramid/labels.js"></script><script src="vendor/d3-flextree-2.1.2.cjs"></script><script src="core.cjs"></script><script src="app.js"></script></body></html>
