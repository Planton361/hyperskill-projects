<header id="application-header"><h1>MyAtlas</h1><nav id="application-nav" aria-label="Main views"><a id="nav-atlas" href="?view=atlas" data-surface="atlas">Atlas</a><a id="nav-skill-tree" href="?view=skill-tree" data-surface="skill-tree">My Skill Tree</a><a id="nav-leetcode" href="?view=leetcode" data-surface="leetcode" aria-current="page">LeetCode</a></nav></header>
<main id="view-content">
<section id="atlas-filters" aria-label="LeetCode filters">
<div id="filter-controls">

<label class="filter-field" id="difficulty-field"><span>Difficulty</span><select id="difficulty" aria-label="Difficulty"><option value="all">All difficulties</option><option>Easy</option><option>Medium</option><option>Hard</option><option value="unknown">Unknown</option></select></label>
<label class="filter-field" id="availability-field"><span>Availability</span><select id="premium" aria-label="Availability"><option value="all">All availability</option><option value="free">Free — dataset flag</option><option value="premium">Premium — dataset flag</option><option value="unknown">Unknown</option></select></label>
<details id="branch-menu"><summary>Branches</summary><div id="branch-panel"><div id="taxonomy"></div><details class="loaded-list"><summary>All loaded problems</summary><div id="problem-list"></div></details></div></details>
<button id="reset-filters">Reset filters</button>
<div id="knowledge-search" role="search"><input id="search" type="search" placeholder="Find problems…" aria-label="Search problems by number, title or topic tag" aria-controls="search-results" autocomplete="off"><div id="search-results"></div></div>
</div>
<div id="filter-context"><p id="atlas-context" role="status">Problem Atlas · 18 problems in catalog · 0 solved · Partial catalog</p><span id="result-count" class="sr" role="status"></span></div>
</section>
<div id="map-content"><div id="map-main" data-inspector-open="false" data-inspector-pinned="false">
<section id="canvas-container" aria-label="LeetCode problem floorplan">
<div class="map-controls"><button id="history-back" disabled>Back</button><button id="fit">Fit all</button><button id="fit-subtree" disabled>Fit subtree</button><button id="zoom-out" aria-label="Zoom out">−</button><output id="zoom-label" role="status" aria-label="Map zoom">100%</output><button id="zoom-in" aria-label="Zoom in">+</button></div>
<nav id="overview-guide" aria-label="LeetCode algorithm families"></nav>
<canvas id="world" tabindex="0" role="group" aria-label="LeetCode problem floorplan. Drag to pan, scroll to zoom. Search and Branches provide keyboard navigation."></canvas>
<button id="inspector-toggle" aria-controls="inspector-drawer" aria-expanded="false">Inspect ‹</button>

<div id="problem-tooltip" role="tooltip" hidden></div><canvas id="minimap" width="210" height="115" aria-label="LeetCode world overview" role="img"></canvas>
<div class="map-footer"><span id="world-count"></span><span id="map-status">Overview · select a category to focus</span></div>
</section>
<aside id="inspector-drawer" aria-label="Inspector" hidden><div class="inspector-top"><span>INSPECT / EVIDENCE</span><div class="inspector-tools"><button id="inspector-pin" aria-label="Pin Inspector beside map" aria-pressed="false">Pin</button><button id="clear" aria-label="Clear selection">Clear</button><button id="inspector-close" aria-label="Close Inspector">×</button></div></div><div id="inspect-content" aria-live="polite"></div></aside>
</div></div>
