name: Owner project publishing helper checks
on:
  push:
    paths: ['scripts/publish-hyperskill-project', 'scripts/import-hyperskill-project', 'scripts/templates/**', 'scripts/export_metadata.py', 'scripts/tests/test_publish.py', 'scripts/tests/test_import.py', '.github/workflows/owner-publish-check.yml']
  pull_request:
    paths: ['scripts/publish-hyperskill-project', 'scripts/import-hyperskill-project', 'scripts/templates/**', 'scripts/export_metadata.py', 'scripts/tests/test_publish.py', 'scripts/tests/test_import.py', '.github/workflows/owner-publish-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Disposable import, build and publication regressions
        run: python3 -B -m unittest scripts.tests.test_import scripts.tests.test_publish
