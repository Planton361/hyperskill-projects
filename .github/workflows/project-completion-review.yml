name: Review Git-driven completed Project learning
on:
  push:
    paths:
      - 'java/**'
      - 'scripts/knowledge_atlas/*completion*'
      - 'scripts/*project-completion.py'
      - 'prototypes/knowledge-atlas-v6-skill-tree/progress-analytics.js'
      - 'prototypes/knowledge-atlas-scope-pyramid/catalog.json'
      - 'prototypes/knowledge-atlas-scope-pyramid/scope-index.json'
      - 'prototypes/project-completion/accepted-sync.json'
      - 'prototypes/project-completion/course-completions.json'
      - '.github/workflows/project-completion-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan committed exports and generate public review artifact
        run: python3 -B scripts/sync-project-completion.py > "$RUNNER_TEMP/project-completion-sync.json"
      - name: Summarize changes against accepted projection
        run: |
          python3 -B scripts/sync-project-completion.py --summary < "$RUNNER_TEMP/project-completion-sync.json" > "$RUNNER_TEMP/project-completion-summary.md"
          cat "$RUNNER_TEMP/project-completion-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: project-completion-review-candidate
          path: |
            ${{ runner.temp }}/project-completion-sync.json
            ${{ runner.temp }}/project-completion-summary.md
