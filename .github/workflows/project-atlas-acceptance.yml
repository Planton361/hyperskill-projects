name: Project to MyAtlas acceptance
on:
  pull_request:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/project-atlas-acceptance.yml', 'java/**', 'python/**', 'projects/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages-compatibility:
    name: Full Pages compatibility (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: [committed, java, python, unknown, unmapped, growth]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Planton361/myatlas
          ref: main
          path: build/myatlas
          fetch-depth: 0
          persist-credentials: false
      - name: Select current MyAtlas main or the reviewed compatibility commit
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('build/myatlas')
          contract = json.loads(Path('scripts/templates/myatlas-acceptance.json').read_text())
          commit = contract['bootstrap_commit']
          subprocess.run(['git','-C',str(root),'fetch','origin','+refs/heads/main:refs/remotes/origin/main'], check=True)
          subprocess.run(['git','-C',str(root),'fetch','origin',commit], check=True)
          ancestor = subprocess.run(['git','-C',str(root),'merge-base','--is-ancestor',commit,'origin/main'], check=False)
          if ancestor.returncode:
              raise SystemExit('Merged Schema-4 MyAtlas reader required; incompatible fallback refused')
          subprocess.run(['git','-C',str(root),'checkout','--detach','origin/main'], check=True)
          if not (root/'docs/contracts/hyperskill-code-archive-v4.md').is_file():
              raise SystemExit('Current MyAtlas main lacks the Schema-4 contract')
          print('MyAtlas acceptance commit:', subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD']).decode().strip())
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked browser tooling
        run: |
          npm ci --prefix build/myatlas/scripts/knowledge_atlas --ignore-scripts
          build/myatlas/scripts/knowledge_atlas/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Universal archive to full Pages artifact and browser UI
        run: |
          MYATLAS_ROOT="$PWD/build/myatlas" python3 -B -m unittest scripts.tests.test_acceptance_context scripts.tests.test_universal_validation
          if [ '${{ matrix.scenario }}' = 'growth' ]; then
            python3 -B scripts/test-portfolio-growth.py --myatlas-root build/myatlas
          else
            python3 -B scripts/test-cross-repository.py --myatlas-root build/myatlas --scenario '${{ matrix.scenario }}'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-atlas-${{ matrix.scenario }}
          path: |
            test-results/integration/${{ matrix.scenario }}/
            build/myatlas/test-results/pages-candidate.json
