name: Hyperskill project checks
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - name: Validate the conservative export importer
        run: python3 -B -m unittest discover -s scripts/tests -p test_import.py
      - name: Build each standalone Java export
        run: |
          for wrapper in java/*/gradlew; do
            (cd "$(dirname "$wrapper")" && ./gradlew --no-daemon build)
          done
          git diff --exit-code -- java scripts/templates
