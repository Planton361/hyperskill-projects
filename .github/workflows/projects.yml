name: Hyperskill project checks
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-only archive importer
        run: python3 -B -m unittest discover -s scripts/tests -p test_import.py
      - name: Validate committed archive evidence without executing projects
        run: python3 -B scripts/validate-project-exports.py
