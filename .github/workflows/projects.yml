name: Hyperskill project checks
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit only unchanged trusted policy action
        id: bootstrap
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          if subprocess.check_output(['git','rev-parse','HEAD']).decode().strip() != os.environ['HEAD_SHA']:
              raise SystemExit('Checkout revision mismatch')
          path='.github/actions/change-policy/action.yml'
          base=subprocess.run(['git','show',os.environ['BASE']+':'+path],capture_output=True)
          trusted=base.returncode==0 and base.stdout==Path(path).read_bytes() and os.environ['EVENT'] not in ('schedule','workflow_dispatch')
          category='C' if os.environ['EVENT'] in ('schedule','workflow_dispatch') else 'B'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('trusted='+str(trusted).lower()+'\nclass='+category+'\n')
          if not trusted:
              report=dict(change_class=category,revision=os.environ['HEAD_SHA'],base=os.environ['BASE'],project_ids=[],full_required=True,reason='Policy action new/changed or manual health: full acceptance required')
              raw=json.dumps(report,indent=2)+'\n';Path('change-report.json').write_text(raw)
              print(raw)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output: output.write('```json\n'+raw+'```\n')
          PYCODE
      - uses: ./.github/actions/change-policy
        if: steps.bootstrap.outputs.trusted == 'true'
        id: policy
      - name: Test universal archive importer
        if: steps.policy.outputs.class != 'A'
        run: python3 -B -m unittest scripts.tests.test_import scripts.tests.test_universal_validation
      - name: Validate committed archive evidence without executing projects
        run: python3 -B scripts/validate-project-exports.py
