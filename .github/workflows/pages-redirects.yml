name: Legacy MyAtlas URL redirects
on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build redirect-only Pages output
        run: python3 -B scripts/build-redirects.py
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/pages
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse stale main
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          actual_sha=$(git ls-remote "https://github.com/$REPOSITORY.git" refs/heads/main | cut -f1)
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Deploy legacy redirects
        id: deployment
        uses: actions/deploy-pages@v4
